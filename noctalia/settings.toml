config_version = 8

[bar.default]
background_opacity = 0.0
concave_edge_corners = false
end = ["tray", "notifications", "network", "bluetooth", "volume", "cpu"]
font_family = "Iosevka NF"
font_weight = 400
margin_ends = 0
padding = 10
radius = 0
shadow = false
start = ["workspaces", "media"]
thickness = 20

[desktop_widgets]
enabled = false

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = ["lockscreen-login-box@HDMI-A-1"]

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
box_height = 196.0
box_width = 810.0
cx = 1280.0
cy = 1258.0
output = "HDMI-A-1"
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
background_color = "surface_variant"
background_opacity = 0.88
background_radius = 12.0
center_password_text = false
input_opacity = 1.0
input_radius = 6.0
layout = "regular"
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true
show_media = true
show_session_buttons = true
show_unlock_hint = true
show_weather = true

[shell]
font_family = "Iosevka NF"
polkit_agent = true

[shell.launcher]
app_grid = true

[shell.panel]
launcher_placement = "attached"

[theme]
community_palette = "Everforest Alt"
source = "community"

[wallpaper]
enabled = false

[wallpaper.default]
path = "/usr/share/noctalia/assets/noctalia-wallpaper.png"

[wallpaper.last]
path = "/usr/share/noctalia/assets/noctalia-wallpaper.png"

[widget.gpu]
type = "sysmon"
enabled = true

[widget.gpu_temperature]
type = "sysmon"
enabled = true

