- defaults:
    link:
      relink: true

- clean: ["~"]

- create:
    - ~/.config/
    - ~/.config/tmux/plugins
    - ~/.cache/zsh

- link:
    ~/.bash_aliases: .bash_aliases
    ~/.config/zsh: zsh
    ~/.config/nvim: nvim
    ~/.config/niri: niri
    ~/.config/waybar: waybar
    ~/.config/tmux/tmux.conf: tmux/tmux.conf
    ~/.config/rofi: rofi
    ~/.config/kitty: kitty
    ~/.config/swaync: swaync
    ~/.config/gtk-3.0: gtk-3.0
    ~/.config/gtk-4.0: gtk-4.0
    ~/.local/scripts: scripts
- shell:
    - [git submodule update --init --recursive, Installing submodules]
    - command: chmod +x scripts/*
      description: Making scripts executable
