- defaults:
    link:
      relink: true

- clean: ["~"]

- create:
    - ~/.config/zsh

- link:
    ~/tmux/tmux.conf: .tmux.conf
    ~/.bash_aliases: .bash_aliases
    ~/.fonts: .fonts
    ~/.config/zsh/.zprofile: .zprofile
    ~/.config/zsh/.zshrc: .zshrc
    ~/.config/nvim: nvim

- shell:
    - [git submodule update --init --recursive, Installing submodules]
