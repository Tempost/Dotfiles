- defaults:
    link:
      relink: true

- clean: ["~"]

- create:
    - ~/.config/tmux
    - ~/.config/zsh

- link:
    ~/.config/nvim: nvim
    ~/.bash_aliases: .bash_aliases
    ~/.config/tmux/tmux.conf: tmux/tmux.conf
    ~/.config/zsh/.zprofile: zsh/zprofile
    ~/.config/zsh/.zshrc: zsh/zshrc

- shell:
    - [git submodule update --init --recursive, Installing submodules]
