set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins'

set -g mouse on
set -sg escape-time 0
set -g status-interval 5
set-option -g detach-on-destroy off

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix
bind a last-window
bind r source-file ~/.tmux.conf
set -g base-index 1

set-window-option -g mode-keys vi

bind -r C-k select-pane -U
bind -r C-j select-pane -D
bind -r C-h select-pane -L
bind -r C-l select-pane -R
bind C-p previous-window
bind C-n next-window

bind-key -r f run-shell "tmux neww ~/.local/scripts/workspaces"

bind c new-window -c "#{pane_current_path}"
bind-key "|" split-window -h -c "#{pane_current_path}"
bind-key "\\" split-window -fh -c "#{pane_current_path}"

bind-key "-" split-window -v -c "#{pane_current_path}"
bind-key "_" split-window -fv -c "#{pane_current_path}"
bind-key "%" split-window -h -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"

bind-key -r "<" swap-window -d -t -1
bind-key -r ">" swap-window -d -t +1

set -g default-terminal "xterm-256color"
set -sa terminal-overrides ",xterm*:Tc"

# Allow undercurls for terminals that support them.
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'

# Allow coloured undercurls for terminals that support them.
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'TanglingTreats/tmux-everforest'
set -g @tmux-everforest 'dark-medium'

run '~/.config/tmux/plugins/tpm/tpm'

# status
set -g status-position top
