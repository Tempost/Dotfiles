monitor = , preferred, auto, auto

$terminal     = kitty
$fileManager  = thunar
$menu         = rofi -show drun -show-icons
$screenshot   = grimblast
$browser      = zen-browser
$waybarReload = killall -SIGUSR2 waybar

exec-once = $HOME/.local/scripts/import-env.sh tmux
exec-once = hyprpm reload -n
exec-once = nm-applet & waybar & swaync & hyprpaper
exec-once = [workspace 2 silent] legcord
exec-once = [workspace 3 silent] steam-native

env = XCURSOR_SIZE,                 30
env = XCURSOR_THEME,                everforest-cursors-light
env = HYPRCURSOR_SIZE,              30
env = HYPRCURSOR_THEME,             everforest-cursors-light
env = ELECTRON_OZONE_PLATFORM_HINT, wayland
env = XDG_SESSION_DESKTOP,          wayland
env = QT_QPA_PLATFORM,              wayland
env = SLURP_ARGS,                   -d -c d3c6aa -B 2d353ba2 -b 2d353ba2 -F JetBrainsMono Nerd Font -f png


general {
    gaps_in          = 0
    gaps_out         = 0
    border_size      = 1
    resize_on_border = false
    allow_tearing    = false
    layout           = dwindle
    col.active_border = rgba(D3C6AAA1)

  snap {
    enabled = true
  }
}

dwindle {
  pseudotile = true
}

decoration {
    rounding = 2

    shadow {
        enabled      = true
        range        = 10
        render_power = 20
        color        = rgba(1a1a1aee)
    }


    blur {
        enabled = false
    }
}

animations {
    enabled = false
}

misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo   = true # If true disables the random hyprland logo / anime girl background. :(
}
input {
    kb_layout     = us
    follow_mouse  = 1
    accel_profile = flat
    sensitivity   = 0 # -1.0 - 1.0, 0 means no modification.
}

binds {
  allow_workspace_cycles = true 
}

$mainMod = SUPER # Sets "Windows" key as main modifier

bind = $mainMod,       return, exec, $terminal
bind = $mainMod,       E,      exec, $fileManager
bind = alt,            space,  exec, $menu
bind = $mainMod,       b,      exec, $browser

# Reload waybar
bind = $mainMod ALT, F1, exec,$waybarReload

bind = $mainMod,       F10,    exec, grimblast copy active
bind = $mainMod SHIFT, F10,    exec, grimblast copy area
bind = $mainMod ALT,   F10,    exec, grimblast copy output
bind = $mainMod CTRL,  F10,    exec, grimblast copy screen
 
bind = $mainMod SHIFT, Q, killactive,
bind = alt ctrl,       delete, exit,
bind = $mainMod SHIFT, F, fullscreen
bind = $mainMod,       V, togglefloating,

bind = $mainMod, end,  movewindow, e
bind = $mainMod, home, movewindow, b
bind = $mainMod, h,    movefocus,  l
bind = $mainMod, l,    movefocus,  r
bind = $mainMod, k,    movefocus,  u
bind = $mainMod, j,    movefocus,  d

bind = $mainMod SHIFT, mouse_up,   movefocus,  u
bind = $mainMod SHIFT, mouse_down, movefocus,  d
bind = $mainMod SHIFT, end,        movewindow, e
bind = $mainMod SHIFT, home,       movewindow, b
bind = $mainMod SHIFT, h,          movewindow, l
bind = $mainMod SHIFT, l,          movewindow, r
bind = $mainMod SHIFT, k,          movewindow, u
bind = $mainMod SHIFT, j,          movewindow, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod CTRL, N, exec, $HOME/.local/scripts/chsink

# Example special workspace (scratchpad)
bind = $mainMod CTRL, S, togglespecialworkspace, magic
bind = $mainMod ALT,  S, movetoworkspace,        special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_up,   workspace, e+1
bind = $mainMod, mouse_down, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = alt, mouse:272, movewindow
bindm = alt, mouse:273, resizewindow

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppressevent maximize, class:.*
# Fix some dragging issues with XWayland
windowrule = nofocus,                class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
windowrule = float,                  class:thunar
windowrule = size 1000 750,          class:thunar
windowrule = float,                  class:org.pulseaudio.pavucontrol
windowrule = size 750 750,           class:org.pulseaudio.pavucontrol
windowrule = float,                  class:nm-connection-editor
windowrule = size 500 500,           class:no-connection-editor
windowrule = noshadow,               floating:0

# Steam/Games
windowrule = float,        class:steam
windowrule = maximize,     class:steam, initialTitle:Steam
windowrule = noborder,     class:steam
windowrule = float,        class:steam, title:Friends List
windowrule = size 300 500, class:steam, title:Friends List
windowrule = noborder,     title:Battle.net
windowrule = noshadow,     title:Battle.net
windowrule = noborder,     fullscreen:1
windowrule = noshadow,     fullscreen:1
windowrule = float,        class:^(steam_app_.*)$
windowrule = float,        class:^(steam_proton)$
windowrule = noborder,     title:Guild Wars 2
windowrule = noshadow,     title:Guild Wars 2
